name: Publish Release

on:
  release:
    types:
      - created
  workflow_dispatch: {}

jobs:
  linux:
    name: Build & Push - Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: get_tag
        name: Get Tag
        env:
          GITHUB_HEAD_REF: $${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event.release.tag_name }}" != "" ]
          then
            TAG=$(jq --raw-output '.release.tag_name' $GITHUB_EVENT_PATH)
          else
            TAG=$(git describe --tags --always)
          fi
          
          echo $TAG > semantic.version
          
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import Project
        run: godot --headless --editor --import --path . --quit
      - name: Migration Regression
        run: python3 tests/run_collision_regression.py
      - name: Rendering Regression
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python3 tests/run_collision_regression.py --rendering
      - name: Build Project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path . --export-release linux "$GITHUB_WORKSPACE/build/TetraForce.x86_64"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Client - linux
          path: ${{ github.workspace }}/build
      - name: Package
        run: |
          cd build
          mkdir -p ${{github.workspace}}/tetraforce
          zip -r ${{github.workspace}}/tetraforce/TetraForce.zip .
      - name: Ship to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: tetraforce-builds
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          SOURCE_DIR: ${{github.workspace}}/tetraforce
          DEST_DIR: builds/master/latest/linux
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Clear CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --paths "/builds/master/latest/linux/*"
  windows:
    name: Build & Push - Windows
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [win32, win64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: get_tag
        name: Get Tag
        env:
          GITHUB_HEAD_REF: $${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event.release.tag_name }}" != "" ]
          then
            TAG=$(jq --raw-output '.release.tag_name' $GITHUB_EVENT_PATH)
          else
            TAG=$(git describe --tags --always)
          fi
          
          echo $TAG > semantic.version
          
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import Project
        run: godot --headless --editor --import --path . --quit
      - name: Build Project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path . --export-release "${{ matrix.platform }}" "$GITHUB_WORKSPACE/build/TetraForce.exe"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Client - ${{ matrix.platform }}
          path: ${{ github.workspace }}/build
      - name: Package
        run: |
          cd build
          mkdir -p ${{github.workspace}}/tetraforce
          zip -r ${{github.workspace}}/tetraforce/TetraForce.zip .
      - name: Ship to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: tetraforce-builds
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          SOURCE_DIR: ${{github.workspace}}/tetraforce
          DEST_DIR: builds/master/latest/${{ matrix.platform }}
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Clear CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --paths "/builds/master/latest/${{ matrix.platform }}/*"
  osx:
    name: Build OSX
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - id: get_tag
        name: Get Tag
        env:
          GITHUB_HEAD_REF: $${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event.release.tag_name }}" != "" ]
          then
            TAG=$(jq --raw-output '.release.tag_name' $GITHUB_EVENT_PATH)
          else
            TAG=$(git describe --tags --always)
          fi
          
          echo $TAG > semantic.version
          
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
      - name: Import Project
        run: godot --headless --editor --import --path . --quit
      - name: Build Project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path . --export-release osx "$GITHUB_WORKSPACE/build/TetraForce.zip"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Client - OSX"
          path: ${{ github.workspace }}/build/TetraForce.zip
  publish_osx:
    name: Publish OSX
    runs-on: ubuntu-latest
    needs: osx
    steps:
    - name: Download Build
      uses: actions/download-artifact@v4
      with:
        name: "Client - OSX"
    - name: Configure
      run: |
        mkdir tetraforce
        mv TetraForce.zip ./tetraforce/TetraForce.zip
    - name: Ship to S3
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --follow-symlinks --delete
      env:
        AWS_S3_BUCKET: tetraforce-builds
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: us-east-1
        SOURCE_DIR: ${{github.workspace}}/tetraforce
        DEST_DIR: builds/master/latest/osx
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - name: Clear CloudFront Cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --paths "/builds/master/latest/osx/*"
