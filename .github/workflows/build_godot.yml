name: Build Godot Project

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - preset: linux
            artifact: Client - linux
            output: TetraForce.x86_64
          - preset: win32
            artifact: Client - win32
            output: TetraForce.x86_32.exe
          - preset: win64
            artifact: Client - win64
            output: TetraForce.x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Version
        run: git rev-parse HEAD > semantic.version
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import Project
        run: godot --headless --editor --import --path . --quit
      - name: Collision Regression
        if: matrix.preset == 'linux'
        run: python3 tests/run_collision_regression.py
      - name: Rendering Regression
        if: matrix.preset == 'linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python3 tests/run_collision_regression.py --rendering
      - name: Build Project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path . --export-release "${{ matrix.preset }}" "$GITHUB_WORKSPACE/build/${{ matrix.output }}"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ github.workspace }}/build
